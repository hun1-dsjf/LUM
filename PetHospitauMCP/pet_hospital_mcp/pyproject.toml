[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP service exposing the Go Pet Hospital REST API to AI agents (MCP SDK 2.x, stateless Streamable HTTP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pet Hospital MCP Teaching" }]
keywords = ["mcp", "model-context-protocol", "pet-hospital", "ai-agent"]

dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.12.0",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
